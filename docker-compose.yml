# Local production-like stack: nginx → PHP-FPM → PostgreSQL.
services:
  app:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY, e.g. from "php artisan key:generate --show"}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: stockroom
      DB_USERNAME: stockroom
      DB_PASSWORD: stockroom
      LOG_CHANNEL: stderr
    volumes:
      - public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
    depends_on: [app]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stockroom"]
      interval: 5s
      retries: 10

volumes:
  public:
  pgdata:
