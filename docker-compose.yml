# Local production-like stack: nginx + PHP-FPM in one container, PostgreSQL beside it.
services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY, e.g. from "php artisan key:generate --show"}
      DATABASE_URL: postgres://stockroom:stockroom@db:5432/stockroom
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stockroom"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
